<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>朝陇山周边图鉴档案库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f3f4f6;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pill-btn { white-space: nowrap; flex-shrink: 0; }

    .goods-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .goods-card:hover {
      transform: translateY(-2px);
      border-color: #0284c7;
      box-shadow: 0 10px 20px -6px rgba(2, 132, 199, 0.12);
    }

    .sidebar-btn {
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
    }
    .sidebar-btn:hover {
      background-color: #f1f5f9;
      color: #0284c7;
      border-left-color: #38bdf8;
    }
    .sidebar-btn.active {
      background-color: #e0f2fe;
      color: #0369a1;
      border-left-color: #0284c7;
      font-weight: 700;
    }

    .fade-enter {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white pb-16">

  <script>
    const SUPABASE_URL = 'https://ybheoetxyihxiwtjtrql.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliaGVvZXR4eWloeGl3dGp0cnFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDk0OTcsImV4cCI6MjEwNzgyNTQ5N30.1W9VSg1KX8ucwBeeimCpCtsOjBzcVxxtTtroeEl1i50';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let ALL_GOODS = [];
    let currentFilter = {
      keyword: '',
      batch: 'ALL',
      seriesLine: 'ALL',
      year: 'ALL',
      category: 'ALL',
      sortBy: 'time-asc'
    };

    const expandedCardsMap = {};
    let currentModalImages = [];
    let currentModalImgIndex = 0;

    function parseImageItem(raw) {
      if (!raw) return { url: 'https://placehold.co/400x400/f3f4f6/9ca3af?text=暂无图片', tag: '' };
      if (typeof raw === 'string') {
        const trimmed = raw.trim();
        if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
          try {
            const parsed = JSON.parse(trimmed);
            return { url: parsed.url || '', tag: parsed.tag || '' };
          } catch(e){}
        }
        return { url: trimmed, tag: '' };
      }
      if (typeof raw === 'object') {
        return { url: raw.url || raw.cover_url || '', tag: raw.tag || '' };
      }
      return { url: String(raw), tag: '' };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      setupSearch();
      setupKeyboardNav();
      setupHistoryNav();
      await fetchAllGoods();
      renderSidebarYears();
      updateDynamicSidebars();
      render();
    });

    async function fetchAllGoods() {
      try {
        const { data, error } = await supabaseClient
          .from('arknights_goods')
          .select('*')
          .order('release_date', { ascending: true });

        document.getElementById('loading-state').classList.add('hidden');
        if (error) throw error;
        ALL_GOODS = data || [];
        document.getElementById('total-count').innerText = ALL_GOODS.length;
        document.getElementById('badge-all-count').innerText = ALL_GOODS.length;
      } catch (err) {
        document.getElementById('loading-state').innerHTML = `<span class="text-rose-500 text-xs">加载失败: ${err.message}</span>`;
      }
    }

    function renderSidebarYears() {
      const yearContainer = document.getElementById('sidebar-year-list');
      const dbYears = new Set(ALL_GOODS.map(i => String(i.year)).filter(y => y && y !== 'undefined' && y !== 'null'));
      ['2026', '2025', '2024', '2023', '2022', '2021', '2020', '2019', '2018', '2017'].forEach(y => dbYears.add(y));
      const sortedYears = Array.from(dbYears).sort((a, b) => b.localeCompare(a));

      yearContainer.innerHTML = sortedYears.map(y => `
        <button onclick="setYearFilter('${y}')" id="year-pill-${y}" class="pill-btn year-pill px-2.5 py-0.5 rounded bg-gray-100 text-gray-700 border border-gray-200 text-xs font-mono transition-all">
          ${y}年
        </button>
      `).join('');
    }

    function updateDynamicSidebars() {
      renderSidebarBatches();
      renderSidebarSeriesLines();
    }

    function renderSidebarBatches() {
      const container = document.getElementById('sidebar-batches-list');
      const subtip = document.getElementById('batch-filter-subtip');
      const sectionTitle = document.getElementById('batch-section-title');

      let targetGoods = ALL_GOODS;
      if (currentFilter.year !== 'ALL') {
        targetGoods = ALL_GOODS.filter(i => String(i.year) === String(currentFilter.year));
        sectionTitle.innerText = `${currentFilter.year}年 档期时间线`;
        subtip.innerText = `该年 ${targetGoods.length} 件`;
      } else {
        sectionTitle.innerText = `全历史 档期时间线`;
        subtip.innerText = `早 → 晚`;
      }

      const batchDict = {};
      targetGoods.forEach(item => {
        const dateStr = item.release_date || '2099-12-31';
        const rawSeries = item.series || '常规通贩';
        
        rawSeries.split(/[,，]/).forEach(s => {
          const name = s.trim();
          if (!name) return;
          if (!batchDict[name]) {
            batchDict[name] = { name: name, count: 0, earliestDate: dateStr };
          }
          batchDict[name].count++;
          if (new Date(dateStr) < new Date(batchDict[name].earliestDate)) {
            batchDict[name].earliestDate = dateStr;
          }
        });
      });

      const sortedBatches = Object.values(batchDict).sort((a, b) => {
        return new Date(a.earliestDate || '2099-01-01') - new Date(b.earliestDate || '2099-01-01');
      });

      if (sortedBatches.length === 0) {
        container.innerHTML = '<div class="py-3 text-center text-gray-400 text-xs">无对应档期</div>';
        return;
      }

      container.innerHTML = sortedBatches.map(b => {
        const displayDate = currentFilter.year !== 'ALL' 
          ? (b.earliestDate.length >= 10 ? b.earliestDate.substring(5, 10) : b.earliestDate)
          : (b.earliestDate.length >= 7 ? b.earliestDate.substring(0, 7) : b.earliestDate);

        const isActive = currentFilter.batch === b.name;

        return `
          <button onclick="setBatchFilter('${b.name}')" class="sidebar-btn batch-btn w-full text-left px-2 py-1.5 rounded-lg flex items-center justify-between text-gray-700 ${isActive ? 'active' : ''}">

                ${displayDate}
              </span>
              <span class="truncate text-xs font-medium text-gray-800">${b.name}</span>
            </div>
            <span class="text-[11px] text-gray-400 font-mono shrink-0">${b.count}</span>
          </button>
        `;
      }).join('');
    }

    function renderSidebarSeriesLines() {
      const container = document.getElementById('sidebar-series-lines-list');
      const clearBtn = document.getElementById('btn-clear-series-line');
      
      if (currentFilter.seriesLine !== 'ALL') {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      let targetGoods = ALL_GOODS;
      if (currentFilter.year !== 'ALL') {
        targetGoods = ALL_GOODS.filter(i => String(i.year) === String(currentFilter.year));
      }

      const seriesLineMap = {};

      targetGoods.forEach(i => {
        const line = (i.series_line || '').trim();
        if (!line || line === '独立单品' || line === '独立单品/其他' || line.includes('无特定系列')) {
          return;
        }

        if (!seriesLineMap[line]) seriesLineMap[line] = 0;
        seriesLineMap[line]++;
      });

      const lineList = Object.keys(seriesLineMap).sort((a, b) => seriesLineMap[b] - seriesLineMap[a]);

      if (lineList.length === 0) {
        container.innerHTML = '<div class="py-2 text-center text-gray-400 text-[11px]">暂无系列周边归档</div>';
        return;
      }

      container.innerHTML = lineList.map(name => {
        const isActive = currentFilter.seriesLine === name;
        return `
          <button onclick="setSeriesLineFilter('${name}')" class="sidebar-btn series-line-btn w-full text-left px-2.5 py-1.5 rounded-lg flex justify-between items-center text-gray-700 ${isActive ? 'active' : ''}">
            <span class="truncate pr-1">${name}</span>
            <span class="text-[11px] text-gray-400 font-mono shrink-0">${seriesLineMap[name]}</span>
          </button>
        `;
      }).join('');
    }

      const input = document.getElementById('search-input');
      const clear = document.getElementById('clear-search');

      render();

    window.quickSearchOp = function(e, opName) {
      e.stopPropagation();
      document.getElementById('search-input').value = opName;
      currentFilter.keyword = opName.toLowerCase();
      document.getElementById('clear-search').classList.remove('hidden');
      if (document.getElementById('catalog-view').classList.contains('hidden')) {
        showCatalogView();
      }
      render();

    function resolveSmartCover(item, keyword) {
      let candidateList = [];
      if (item.images && Array.isArray(item.images) && item.images.length > 0) {
        candidateList = item.images.map(parseImageItem);
      } else if (item.cover_url) {
        candidateList = [parseImageItem(item.cover_url)];
      }

      if (candidateList.length === 0) {
        return { cover: 'https://placehold.co/400x400/f3f4f6/9ca3af?text=暂无图片', matchedTag: '' };
      }

      const defaultCover = candidateList[0].url;
      if (!keyword) return { cover: defaultCover, matchedTag: '' };

      for (let img of candidateList) {
        if (img.tag) {
          const t = img.tag.toLowerCase();
          if (t.includes(keyword) || keyword.includes(t)) {
            return { cover: img.url, matchedTag: img.tag };
          }
        }
      }
      return { cover: defaultCover, matchedTag: '' };
    }

    function render() {
      let filtered = ALL_GOODS.filter(item => {
        if (currentFilter.keyword) {
          const kw = currentFilter.keyword;
          const matchTitle = (item.title || '').toLowerCase().includes(kw);
          const matchOps = (item.operators || []).some(op => String(op).toLowerCase().includes(kw));
          const matchSeries = (item.series || '').toLowerCase().includes(kw);
          const matchSeriesLine = (item.series_line || '').toLowerCase().includes(kw);
          const matchCat = (item.category || '').toLowerCase().includes(kw);
          const matchMat = (item.material || '').toLowerCase().includes(kw);
          const matchNote = (item.note || '').toLowerCase().includes(kw);
          const matchImgTag = (item.images || []).some(img => {
            const parsed = parseImageItem(img);
            return parsed.tag && parsed.tag.toLowerCase().includes(kw);
          });
          const matchRp = (item.reprint_history || []).some(rp => (rp.series || '').toLowerCase().includes(kw));
          if (!matchTitle && !matchOps && !matchSeries && !matchSeriesLine && !matchCat && !matchMat && !matchNote && !matchImgTag && !matchRp) return false;
        }

        if (currentFilter.batch !== 'ALL') {
          const b = currentFilter.batch;
          const inSeries = (item.series || '').includes(b);
          const inRp = (item.reprint_history || []).some(rp => (rp.series || '').includes(b));
          if (!inSeries && !inRp) return false;
        }

        if (currentFilter.seriesLine !== 'ALL') {
          const sl = currentFilter.seriesLine;
          const matchField = (item.series_line || '').trim() === sl;
          if (!matchField) return false;
        }

        if (currentFilter.year !== 'ALL' && String(item.year) !== String(currentFilter.year)) return false;
        if (currentFilter.category !== 'ALL' && !(item.category || '').includes(currentFilter.category)) return false;

        return true;
      });

      filtered.sort((a, b) => {
        const ta = new Date(a.release_date || '2019-01-01').getTime();
        const tb = new Date(b.release_date || '2019-01-01').getTime();
        return currentFilter.sortBy === 'time-asc' ? ta - tb : tb - ta;
      });

      document.getElementById('match-count').innerText = filtered.length;
      const grid = document.getElementById('goods-grid');
      const empty = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "goods-card rounded-xl overflow-hidden flex flex-col justify-between Antigravity-pointer group";
        
        const { cover, matchedTag } = resolveSmartCover(item, currentFilter.keyword);
        card.onclick = () => openItemDetail(item, matchedTag);

        const ops = item.operators || [];
        const imgCount = (item.images && item.images.length > 1) ? item.images.length : 0;
        const rpCount = (item.reprint_history && Array.isArray(item.reprint_history)) ? item.reprint_history.length : 0;
        const isExpanded = !!expandedCardsMap[item.id];
        let opsHtml = '';

        if (ops.length > 0) {
          if (!isExpanded && ops.length > 2) {
            const displayedOps = ops.slice(0, 2);
            const remainCount = ops.length - 2;
            opsHtml = `
              <div class="flex items-center gap-1 mb-1.5 flex-wrap">
                ${displayedOps.map(op => `<button type="button" onclick="quickSearchOp(event, '${op}')" class="text-[10px] sm:text-xs px-1.5 py-0.2 rounded bg-gray-100 hover:bg-sky-50 text-gray-700 hover:text-sky-700 border border-gray-200">#${op}</button>`).join('')}
                <button type="button" onclick="toggleOpsExpansion(event, '${item.id}')" title="点击展开全部干员" class="text-[10px] sm:text-xs px-1 py-0.2 rounded bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100 font-bold">
                  +${remainCount}
                </button>
              </div>
            `;
          } else {
            opsHtml = `
              <div class="flex items-center gap-1 mb-1.5 flex-wrap">
                ${ops.map(op => `<button type="button" onclick="quickSearchOp(event, '${op}')" class="text-[10px] sm:text-xs px-1.5 py-0.2 rounded bg-gray-100 hover:bg-sky-50 text-gray-700 hover:text-sky-700 border border-gray-200">#${op}</button>`).join('')}
                ${ops.length > 2 ? `
                  <button type="button" onclick="toggleOpsExpansion(event, '${item.id}')" title="点击收起干员" class="text-[10px] sm:text-xs px-1.5 py-0.2 rounded bg-gray-100 text-gray-500 hover:text-gray-900 border border-gray-200">
                    收起
                  </button>
                ` : ''}
              </div>
            `;
          }
        }

        const formattedPrice = item.price.startsWith('¥') || !isNaN(item.price) 
          ? (item.price.startsWith('¥') ? item.price : '¥' + item.price) 
          : item.price;

        const hasSeriesLine = item.series_line && item.series_line.trim() !== '独立单品';

        card.innerHTML = `
          <div>
            <div class="relative w-full aspect-square bg-gray-100 overflow-hidden flex items-center justify-center border-b border-gray-100">
              <img src="${cover}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/400x400/f3f4f6/9ca3af?text=载入中'">
              
              <div class="absolute top-1.5 left-1.5 flex gap-1 flex-wrap max-w-[80%]">
                <span class="bg-sky-600 text-white font-bold text-[10px] px-1.5 py-0.2 rounded shadow-xs">
                  ${item.category || '谷子'}
                </span>
                ${item.is_limited ? '<span class="bg-rose-500 text-white font-mono text-[10px] px-1.5 py-0.2 rounded font-bold shadow-xs">特典</span>' : ''}
                ${rpCount > 0 ? `<span class="bg-amber-500 text-white font-mono text-[10px] px-1.5 py-0.2 rounded font-bold shadow-xs">再版×${rpCount}</span>` : ''}
                ${matchedTag ? `<span class="bg-white/95 text-amber-700 border border-amber-300 font-bold text-[9px] px-1 py-0.2 rounded shadow-xs">定位:${matchedTag}</span>` : ''}
              </div>

              ${imgCount > 0 ? `
                <div class="absolute top-1.5 right-1.5 bg-black/60 backdrop-blur text-white font-mono text-[10px] px-1.5 py-0.2 rounded flex items-center gap-0.5 font-bold">
                  <i data-lucide="image" class="w-2.5 h-2.5"></i>
                  <span>${imgCount}</span>
                </div>
              ` : ''}

              <span class="absolute bottom-1 right-1 bg-white/90 backdrop-blur text-gray-700 font-mono text-[9px] px-1 py-0.2 rounded border border-gray-200">
                ${item.release_date || ''}
              </span>
            </div>

            <div class="p-2.5 sm:p-3.5">
              ${opsHtml}
              <h3 class="text-xs sm:text-sm font-bold text-gray-900 group-hover:text-sky-600 transition-colors leading-snug line-clamp-2" title="${item.title}">
                ${item.title}
              </h3>
              <div class="flex items-center gap-1 text-[11px] text-gray-500 mt-1 truncate">
                ${hasSeriesLine ? `<span class="text-sky-700 font-semibold truncate">${item.series_line}</span><span>·</span>` : ''}
                <span class="truncate">${item.series || '官方企划'}</span>
              </div>
            </div>
          </div>

          <div class="px-2.5 py-2 sm:px-3.5 sm:py-2.5 bg-gray-50/80 border-t border-gray-100 flex flex-col gap-0.5">
            <div class="flex items-baseline justify-between gap-1">
              <span class="text-gray-400 text-[10px]">定价:</span>
              <span class="text-amber-600 font-bold text-xs sm:text-sm font-mono truncate">
                ${formattedPrice}
              </span>
            </div>
            <div class="flex items-center justify-between text-[10px] text-gray-400 pt-0.5">
              <span>渠道:</span>
              <span class="text-sky-700 font-medium truncate max-w-[100px] text-right">
                ${item.obtain_type || '线上购入'}
              </span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function openItemDetail(item, targetTag) {
      history.pushState({ view: 'detail', id: item.id }, '', `#item-${item.id}`);

      let rawList = [];
      if (item.images && Array.isArray(item.images) && item.images.length > 0) {
        rawList = item.images;
      } else if (item.cover_url) {
        rawList = [item.cover_url];
      }

      currentModalImages = rawList.map(parseImageItem).filter(i => i.url && i.url.trim());
      if (currentModalImages.length === 0) {
        currentModalImages = [{ url: 'https://placehold.co/400x400/f3f4f6/9ca3af?text=暂无图片', tag: '' }];
      }

      currentModalImgIndex = 0;
      if (targetTag) {
        const foundIdx = currentModalImages.findIndex(i => i.tag && i.tag.toLowerCase().includes(targetTag.toLowerCase()));
        if (foundIdx >= 0) currentModalImgIndex = foundIdx;
      }

      updateDetailImgDisplay();

      document.getElementById('view-b-title').innerText = item.title;
      document.getElementById('view-b-series').innerText = `首发企划档期：${item.series || '官方企划'}`;
      document.getElementById('view-b-date').innerText = item.release_date || '发售日待考';
      document.getElementById('view-b-category').innerText = item.category || '谷子';
      document.getElementById('view-b-price').innerText = item.price || '未标明';

      const ops = item.operators || [];
      const opsContainer = document.getElementById('view-b-ops-box');

        opsContainer.innerHTML = ops.map(op => `
          <button type="button" onclick="quickSearchOp(event, '${op}')" class="px-2 py-0.5 bg-gray-100 hover:bg-sky-50 text-gray-800 hover:text-sky-700 rounded text-[11px] border border-gray-200 font-medium transition-colors" title="点击筛选该干员全库">
            #${op}
          </button>

        opsContainer.innerHTML = '<span class="text-gray-400">全员 / 无特定干员</span>';

      document.getElementById('view-b-channel').innerText = item.obtain_type || '线上购入';

          <div class="p-2.5 bg-white rounded-lg border border-amber-200/80 flex flex-col gap-1 shadow-2xs">
            <div class="flex items-center justify-between">
              <span class="text-amber-800 font-bold text-xs">${rp.tag || '复刻再版'}</span>
              <span class="text-gray-400 text-[11px] font-mono">${rp.date || ''}</span>
            </div>
            <div class="text-gray-900 font-bold text-xs">${rp.series || '官方复刻企划'}</div>
            <div class="flex justify-between items-center text-[11px] text-gray-500 pt-1 border-t border-gray-100">
              <span>定价: <strong class="text-amber-600 font-mono font-bold">${rp.price || '原价'}</strong></span>
              <span>渠道: <strong class="text-sky-700">${rp.channel || '线上通贩'}</strong></span>

    function backToCatalog() {
      history.pushState(null, '', window.location.pathname);
      showCatalogView();
    }

    function showCatalogView() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('catalog-view').classList.remove('hidden');
    }

    function updateDetailImgDisplay() {
      const mainImg = document.getElementById('view-b-main-img');
      const pageBadge = document.getElementById('view-b-page-badge');
      const tagBadge = document.getElementById('view-b-tag-badge');
      const thumbRail = document.getElementById('view-b-thumb-rail');
      const prevBtn = document.getElementById('view-b-prev-btn');
      const nextBtn = document.getElementById('view-b-next-btn');

      const cur = currentModalImages[currentModalImgIndex] || { url: '', tag: '' };
      mainImg.src = cur.url;
      pageBadge.innerText = `${currentModalImgIndex + 1} / ${currentModalImages.length}`;

      if (cur.tag) {
        tagBadge.classList.remove('hidden');
        tagBadge.innerText = cur.tag;
      } else {
        tagBadge.classList.add('hidden');
      }

      if (currentModalImages.length <= 1) {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        pageBadge.classList.add('hidden');
        thumbRail.classList.add('hidden');
        thumbRail.innerHTML = '';
      } else {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        pageBadge.classList.remove('hidden');
        thumbRail.classList.remove('hidden');
        
        thumbRail.innerHTML = currentModalImages.map((item, i) => `
          <div onclick="switchModalImgIndex(${i})" class="flex flex-col items-center gap-1 shrink-0 Antigravity-pointer group">
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-lg border ${i === currentModalImgIndex ? 'border-sky-600 ring-2 ring-sky-200' : 'border-gray-200 opacity-60 hover:opacity-100'} overflow-hidden bg-gray-50 transition-all shadow-xs">
              <img src="${item.url}" class="w-full h-full object-cover">
            </div>
            ${item.tag ? `<span class="text-[10px] font-mono max-w-[50px] truncate text-center transition-colors ${i === currentModalImgIndex ? 'text-sky-700 font-bold' : 'text-gray-400 group-hover:text-gray-700'}">${item.tag}</span>` : ''}
          </div>
        `).join('');
      }
    }

    function prevModalImg(e) {
      if (e) e.stopPropagation();
      if (currentModalImages.length <= 1) return;
      currentModalImgIndex = (currentModalImgIndex - 1 + currentModalImages.length) % currentModalImages.length;
      updateDetailImgDisplay();
    }

    function nextModalImg(e) {
      if (e) e.stopPropagation();
      if (currentModalImages.length <= 1) return;
      currentModalImgIndex = (currentModalImgIndex + 1) % currentModalImages.length;
      updateDetailImgDisplay();
    }

    window.switchModalImgIndex = function(index) {
      currentModalImgIndex = index;
      updateDetailImgDisplay();
    };
  </script>
</body>
</html>
