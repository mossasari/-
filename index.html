<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>朝陇山谷子图鉴档案库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0b0c10;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pill-btn { white-space: nowrap; flex-shrink: 0; }

    .goods-card {
      background: #14161f;
      border: 1px solid #232635;
      transition: all 0.22s ease-out;
    }
    .goods-card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px -8px rgba(56, 189, 248, 0.12);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-black pb-16">

  <!-- 1. 吸顶导航与快速检索 -->
  <header class="sticky top-0 z-40 bg-[#0f1017]/95 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3 sm:px-8 sm:py-3.5">
    <div class="max-w-7xl mx-auto flex flex-col gap-2.5">
      
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-cyan-400 text-black font-black flex items-center justify-center rounded text-sm tracking-tighter shadow-md shadow-cyan-400/20 font-mono">
            CLS
          </div>
          <div>
            <h1 class="text-sm sm:text-base font-bold tracking-wide text-white flex items-center gap-2">
              朝陇山周边档案库
              <span class="text-[10px] bg-zinc-800 text-cyan-400 border border-zinc-700 px-1.5 py-0.2 rounded font-mono font-normal">2017-NOW</span>
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a href="admin.html" class="text-xs bg-cyan-400/10 hover:bg-cyan-400/20 text-cyan-300 border border-cyan-500/40 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors font-medium">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>录入/修改周边</span>
          </a>
          <div class="text-xs font-mono text-zinc-400 hidden sm:block">
            全库收录: <span id="total-count" class="text-cyan-400 font-bold">0</span>
          </div>
        </div>
      </div>

      <!-- 搜索框 -->
      <div class="relative w-full">
        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-cyan-400 w-4 h-4 pointer-events-none"></i>
        <input 
          id="search-input"
          type="search"
          placeholder="按干员搜 (搜'陈'自动换成陈单人封面)、周边名、企划系列、材质..."
          class="w-full bg-[#171822] text-white placeholder-zinc-500 pl-10 pr-9 py-2 rounded-xl border border-zinc-700/80 focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-500/30 text-xs sm:text-sm shadow-inner transition-colors"
        />
        <button id="clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 p-1 hover:text-white">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- 级联筛选台 -->
      <div class="flex flex-col gap-2 pt-1 border-t border-zinc-800/60">
        
        <!-- 行一：年份与月份联动 -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 text-xs font-mono">
          <span class="text-zinc-400 text-xs shrink-0 font-bold flex items-center gap-1">
            <i data-lucide="calendar" class="w-3.5 h-3.5 text-cyan-400"></i> 年份:
          </span>
          <select id="select-year" onchange="onYearChange(this.value)" class="bg-[#171822] border border-zinc-700 rounded-lg px-2.5 py-1 text-cyan-300 font-bold text-xs outline-none focus:border-cyan-400">
            <option value="ALL">全部年份</option>
            <option value="2026">2026 年</option>
            <option value="2025">2025 年</option>
            <option value="2024">2024 年</option>
            <option value="2023">2023 年</option>
            <option value="2022">2022 年</option>
            <option value="2021">2021 年</option>
            <option value="2020">2020 年</option>
            <option value="2019" selected>2019 开市年</option>
            <option value="2018">2018 年</option>
            <option value="2017">2017 早期物料</option>
          </select>

          <span class="text-zinc-400 text-xs shrink-0 font-bold ml-1">月份:</span>
          <select id="select-month" onchange="onMonthChange(this.value)" class="bg-[#171822] border border-zinc-700 rounded-lg px-2 py-1 text-zinc-200 text-xs outline-none focus:border-cyan-400">
            <option value="ALL">全年月度</option>
            <option value="01">01 月</option><option value="02">02 月</option><option value="03">03 月</option>
            <option value="04">04 月</option><option value="05">05 月</option><option value="06">06 月</option>
            <option value="07">07 月</option><option value="08">08 月</option><option value="09">09 月</option>
            <option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option>
          </select>

          <button onclick="resetFilters()" class="text-xs text-zinc-400 hover:text-cyan-400 ml-auto shrink-0 font-sans font-medium flex items-center gap-1">
            <i data-lucide="rotate-ccw" class="w-3 h-3"></i> 重置筛选
          </button>
        </div>

        <!-- 行二：企划系列横滑胶囊 -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 text-xs">
          <span class="text-zinc-400 text-xs shrink-0 font-bold flex items-center gap-1">
            <i data-lucide="layers" class="w-3.5 h-3.5 text-cyan-400"></i> 企划系列:
          </span>
          <div id="series-capsules" class="flex gap-1.5">
            <button class="pill-btn px-2.5 py-0.5 rounded-full bg-cyan-400 text-black font-bold text-xs">全部企划</button>
          </div>
        </div>

        <!-- 行三：制品分类横滑 -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 text-xs">
          <span class="text-zinc-400 text-xs shrink-0 font-bold flex items-center gap-1">
            <i data-lucide="tag" class="w-3.5 h-3.5 text-cyan-400"></i> 品类:
          </span>
          <div id="type-capsules" class="flex gap-1.5">
            <button data-type="ALL" onclick="onTypeChange('ALL')" class="pill-btn type-pill active px-2.5 py-0.5 rounded-full bg-cyan-400 text-black font-bold text-xs">全部</button>
            <button data-type="立牌" onclick="onTypeChange('立牌')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">立牌</button>
            <button data-type="徽章" onclick="onTypeChange('徽章')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">徽章</button>
            <button data-type="挂件" onclick="onTypeChange('挂件')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">挂件</button>
            <button data-type="手办" onclick="onTypeChange('手办')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">手办</button>
            <button data-type="贴纸" onclick="onTypeChange('贴纸')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">贴纸</button>
            <button data-type="色纸" onclick="onTypeChange('色纸')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">色纸</button>
            <button data-type="明信片" onclick="onTypeChange('明信片')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">明信片</button>
            <button data-type="毛绒" onclick="onTypeChange('毛绒')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">毛绒</button>
            <button data-type="生活" onclick="onTypeChange('生活')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">生活</button>
            <button data-type="虚拟兑换" onclick="onTypeChange('虚拟兑换')" class="pill-btn type-pill px-2.5 py-0.5 rounded-full bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500 text-xs">虚拟兑换</button>
          </div>
        </div>

      </div>

    </div>
  </header>

  <!-- 2. 主页面内容展区 -->
  <main class="max-w-7xl w-full mx-auto px-4 sm:px-8 py-5 flex-1">
    
    <div class="flex items-center justify-between pb-2.5 text-xs text-zinc-400 border-b border-zinc-800/80 mb-4">
      <div>
        匹配周边: <span id="match-count" class="text-cyan-400 font-bold font-mono text-sm ml-1">0</span> 件
      </div>
      <div class="flex items-center gap-2">
        <span>排序:</span>
        <select id="sort-select" onchange="onSortChange(this.value)" class="bg-[#14161f] border border-zinc-700 rounded-lg px-2 py-1 text-zinc-200 text-xs focus:outline-none focus:border-cyan-400">
          <option value="time-asc">发售时间 (早 → 晚)</option>
          <option value="time-desc">发售时间 (晚 → 早)</option>
        </select>
      </div>
    </div>

    <div id="loading-state" class="py-24 text-center text-zinc-400 font-mono text-xs flex flex-col items-center gap-2">
      <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-cyan-400"></i>
      <span>正在同步朝陇山谷物档案...</span>
    </div>

    <div id="empty-state" class="hidden py-24 text-center text-zinc-500 font-mono text-xs">
      未找到符合筛选条件的周边记录。
    </div>

    <!-- 谷子卡片网格 -->
    <div id="goods-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5 sm:gap-5"></div>

  </main>

  <!-- 🌟 3. 重构级大画廊弹窗 (大画幅 · 无遮挡切换 · 清爽多图轨道) -->
  <div id="detail-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-6" onclick="closeDetailModal()">
    <div class="bg-[#13151f] border border-zinc-700/80 w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl relative max-h-[94vh] flex flex-col" onclick="event.stopPropagation()">
      
      <!-- 右上角大号关闭按钮 -->
      <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white bg-zinc-800/80 hover:bg-zinc-700 w-8 h-8 rounded-full flex items-center justify-center z-30 transition">✕</button>

      <div class="overflow-y-auto p-5 sm:p-7 flex flex-col lg:flex-row gap-6 lg:gap-8 items-start">
        
        <!-- 左侧多图大画廊展示区 (大画幅) -->
        <div class="w-full lg:w-3/5 flex flex-col gap-3">
          
          <!-- 主图视窗：自适应高度，绝不扁缩 -->
          <div class="relative w-full min-h-[300px] max-h-[460px] bg-[#07080b] rounded-xl border border-zinc-800/90 flex items-center justify-center overflow-hidden group select-none shadow-inner">
            <img id="modal-main-img" src="" class="max-w-full max-h-[440px] w-auto h-auto object-contain Antigravity-zoom-in" onclick="window.open(this.src)" title="点击新标签页看超大高清原图">
            
            <!-- 切换箭头：悬浮微光侧边大按键 -->
            <button id="modal-prev-btn" onclick="prevModalImg(event)" class="absolute left-2.5 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/60 hover:bg-black/90 text-white flex items-center justify-center border border-zinc-700/70 backdrop-blur transition-all opacity-70 hover:opacity-100 hover:scale-105">
              <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>

            <button id="modal-next-btn" onclick="nextModalImg(event)" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/60 hover:bg-black/90 text-white flex items-center justify-center border border-zinc-700/70 backdrop-blur transition-all opacity-70 hover:opacity-100 hover:scale-105">
              <i data-lucide="chevron-right" class="w-6 h-6"></i>
            </button>

            <!-- 底部页码指示条 -->
            <div id="modal-page-badge" class="absolute bottom-2.5 right-2.5 bg-black/80 backdrop-blur text-cyan-300 border border-cyan-500/40 text-[11px] font-mono px-2.5 py-0.5 rounded-full font-bold">
              1 / 1
            </div>

            <!-- 当前大图关联的干员/特典Tag -->
            <div id="modal-tag-badge" class="hidden absolute top-3 left-3 bg-cyan-950/90 backdrop-blur text-cyan-300 border border-cyan-500/50 text-xs font-mono px-2.5 py-1 rounded-md font-bold shadow-md"></div>
          </div>

          <!-- 🌟 舒展多图缩略图轨道 (Tag展示在图片下方，绝不压图) -->
          <div id="modal-thumb-rail" class="flex gap-2.5 overflow-x-auto no-scrollbar py-1"></div>
        </div>

        <!-- 右侧档案详细信息 -->
        <div class="w-full lg:w-2/5 flex flex-col justify-between text-xs space-y-4">
          <div>
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span id="modal-category" class="px-2.5 py-1 bg-cyan-400/10 text-cyan-300 border border-cyan-500/30 text-xs font-bold rounded-md">分类</span>
              <span id="modal-date" class="px-2.5 py-1 bg-zinc-800 text-zinc-300 font-mono text-xs rounded-md">2019-05-25</span>
              <span id="modal-limited" class="hidden px-2.5 py-1 bg-rose-500/20 text-rose-300 border border-rose-500/40 text-xs font-bold font-mono rounded-md">限定特典</span>
            </div>
            
            <h3 id="modal-title" class="text-lg sm:text-xl font-black text-white leading-snug tracking-tight mb-1">谷子全称</h3>
            <p id="modal-series" class="text-zinc-400 text-xs font-medium mb-4">所属企划：-</p>

            <div class="space-y-3 bg-[#191b24] p-4 rounded-xl border border-zinc-700/60 text-xs font-mono">
              <div class="flex justify-between items-center border-b border-zinc-700/50 pb-2.5">
                <span class="text-zinc-400 font-sans font-medium">官方发售定价</span>
                <span id="modal-price" class="text-amber-300 font-bold text-base sm:text-lg font-mono">¥ 0.00</span>
              </div>
              
              <div class="flex flex-col gap-1.5 border-b border-zinc-700/50 pb-2.5">
                <span class="text-zinc-400 font-sans font-medium">登场干员</span>
                <div id="modal-ops-box" class="flex flex-wrap gap-1.5"></div>
              </div>

              <div class="flex justify-between items-start">
                <span class="text-zinc-400 font-sans font-medium shrink-0">材质/规格</span>
                <span id="modal-spec" class="text-zinc-200 text-right leading-relaxed">-</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-zinc-400 font-sans font-medium shrink-0">获取途径</span>
                <span id="modal-channel" class="text-cyan-300 font-semibold text-right">-</span>
              </div>
            </div>

            <!-- 考据笔记 -->
            <div id="modal-desc-box" class="mt-4 p-3.5 bg-zinc-900/80 rounded-xl border border-zinc-800 text-zinc-300 text-xs leading-relaxed"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ybheoetxyihxiwtjtrql.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliaGVvZXR4eWloeGl3dGp0cnFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDk0OTcsImV4cCI6MjEwNzgyNTQ5N30.1W9VSg1KX8ucwBeeimCpCtsOjBzcVxxtTtroeEl1i50';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let ALL_GOODS = [];
    let currentFilter = {
      keyword: '',
      year: '2019',
      month: 'ALL',
      series: 'ALL',
      type: 'ALL',
      sortBy: 'time-asc'
    };

    const expandedCardsMap = {};
    let currentModalImages = [];
    let currentModalImgIndex = 0;

    function parseImageItem(raw) {
      if (!raw) return { url: 'https://placehold.co/400x400/18181b/22d3ee?text=暂无图片', tag: '' };
      if (typeof raw === 'string') {
        if (raw.trim().startsWith('{') && raw.trim().endsWith('}')) {
          try {
            const parsed = JSON.parse(raw);
            return { url: parsed.url || '', tag: parsed.tag || '' };
          } catch(e){}
        }
        return { url: raw, tag: '' };
      }
      if (typeof raw === 'object') {
        return { url: raw.url || '', tag: raw.tag || '' };
      }
      return { url: String(raw), tag: '' };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      setupSearch();
      setupKeyboardNav();
      await fetchAllGoods();
      refreshSeriesCapsules();
      render();
    });

    async function fetchAllGoods() {
      try {
        const { data, error } = await supabaseClient
          .from('arknights_goods')
          .select('*')
          .order('release_date', { ascending: true });

        document.getElementById('loading-state').classList.add('hidden');
        if (error) throw error;
        ALL_GOODS = data || [];
        document.getElementById('total-count').innerText = ALL_GOODS.length;

        const yearSelect = document.getElementById('select-year');
        const dbYears = new Set(ALL_GOODS.map(i => String(i.year)).filter(y => y && y !== 'undefined' && y !== 'null'));
        ['2026', '2025', '2024', '2023', '2022', '2021', '2020', '2019', '2018', '2017'].forEach(y => dbYears.add(y));
        const sortedYears = Array.from(dbYears).sort((a, b) => b.localeCompare(a));
        const curVal = currentFilter.year;
        
        yearSelect.innerHTML = '<option value="ALL">全部年份</option>' + sortedYears.map(y => `
          <option value="${y}" ${curVal === y ? 'selected' : ''}>${y === '2019' ? '2019 开市年' : y === '2017' ? '2017 早期物料' : y + ' 年'}</option>
        `).join('');

      } catch (err) {
        document.getElementById('loading-state').innerHTML = `<span class="text-rose-400 text-xs">加载失败: ${err.message}</span>`;
      }
    }

    function setupSearch() {
      const input = document.getElementById('search-input');
      const clear = document.getElementById('clear-search');
      input.addEventListener('input', (e) => {
        currentFilter.keyword = e.target.value.trim().toLowerCase();
        clear.classList.toggle('hidden', !currentFilter.keyword);
        render();
      });
      clear.addEventListener('click', () => {
        input.value = '';
        currentFilter.keyword = '';
        clear.classList.add('hidden');
        render();
      });
    }

    function setupKeyboardNav() {
      window.addEventListener('keydown', (e) => {
        const modal = document.getElementById('detail-modal');
        if (modal.classList.contains('hidden')) return;

        if (e.key === 'ArrowLeft') prevModalImg();
        else if (e.key === 'ArrowRight') nextModalImg();
        else if (e.key === 'Escape') closeDetailModal();
      });
    }

    function refreshSeriesCapsules() {
      const container = document.getElementById('series-capsules');
      let candidateGoods = ALL_GOODS;
      if (currentFilter.year !== 'ALL') {
        candidateGoods = candidateGoods.filter(i => String(i.year) === String(currentFilter.year));
      }

      const seriesSet = new Set();
      candidateGoods.forEach(i => {
        if (i.series && i.series.trim()) seriesSet.add(i.series.trim());
      });

      const list = ['ALL', ...Array.from(seriesSet)];
      container.innerHTML = list.map(name => {
        const active = currentFilter.series === name;
        return `
          <button onclick="onSeriesChange('${name}')" class="pill-btn px-2.5 py-0.5 rounded-full text-xs font-medium transition-all ${
            active ? 'bg-cyan-400 text-black font-bold shadow-md shadow-cyan-400/20' : 'bg-[#171822] text-zinc-300 hover:border-zinc-500 border border-zinc-700/80'
          }">
            ${name === 'ALL' ? '全部企划' : name}
          </button>
        `;
      }).join('');
    }

    function onYearChange(val) {
      currentFilter.year = val;
      currentFilter.series = 'ALL';
      refreshSeriesCapsules();
      render();
    }

    function onMonthChange(val) { currentFilter.month = val; render(); }
    function onSeriesChange(val) { currentFilter.series = val; refreshSeriesCapsules(); render(); }

    function onTypeChange(val) {
      currentFilter.type = val;
      document.querySelectorAll('.type-pill').forEach(btn => {
        const active = btn.dataset.type === val;
        btn.className = `pill-btn type-pill px-2.5 py-0.5 rounded-full text-xs font-semibold transition-all ${
          active ? 'bg-cyan-400 text-black font-bold shadow-md shadow-cyan-400/20' : 'bg-[#171822] text-zinc-300 border border-zinc-700/80 hover:border-zinc-500'
        }`;
      });
      render();
    }

    function onSortChange(val) { currentFilter.sortBy = val; render(); }

    function resetFilters() {
      currentFilter = { keyword: '', year: 'ALL', month: 'ALL', series: 'ALL', type: 'ALL', sortBy: 'time-asc' };
      document.getElementById('select-year').value = 'ALL';
      document.getElementById('select-month').value = 'ALL';
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search').classList.add('hidden');
      onTypeChange('ALL');
      refreshSeriesCapsules();
      render();
    }

    window.toggleOpsExpansion = function(e, itemId) {
      e.stopPropagation();
      expandedCardsMap[itemId] = !expandedCardsMap[itemId];
      render();
    };

    window.quickSearchOp = function(e, opName) {
      e.stopPropagation();
      document.getElementById('search-input').value = opName;
      currentFilter.keyword = opName.toLowerCase();
      document.getElementById('clear-search').classList.remove('hidden');
      render();
    };

    function resolveSmartCover(item, keyword) {
      let candidateList = [];
      if (item.images && Array.isArray(item.images) && item.images.length > 0) {
        candidateList = item.images.map(parseImageItem);
      } else if (item.cover_url) {
        candidateList = [parseImageItem(item.cover_url)];
      }

      if (candidateList.length === 0) {
        return { cover: 'https://placehold.co/400x400/18181b/22d3ee?text=暂无图片', matchedTag: '' };
      }

      const defaultCover = candidateList[0].url;
      if (!keyword) return { cover: defaultCover, matchedTag: '' };

      for (let img of candidateList) {
        if (img.tag) {
          const t = img.tag.toLowerCase();
          if (t.includes(keyword) || keyword.includes(t)) {
            return { cover: img.url, matchedTag: img.tag };
          }
        }
      }
      return { cover: defaultCover, matchedTag: '' };
    }

    function render() {
      let filtered = ALL_GOODS.filter(item => {
        if (currentFilter.keyword) {
          const kw = currentFilter.keyword;
          const matchTitle = (item.title || '').toLowerCase().includes(kw);
          const matchOps = (item.operators || []).some(op => String(op).toLowerCase().includes(kw));
          const matchSeries = (item.series || '').toLowerCase().includes(kw);
          const matchCat = (item.category || '').toLowerCase().includes(kw);
          const matchMat = (item.material || '').toLowerCase().includes(kw);
          const matchNote = (item.note || '').toLowerCase().includes(kw);
          const matchImgTag = (item.images || []).some(img => {
            const parsed = parseImageItem(img);
            return parsed.tag && parsed.tag.toLowerCase().includes(kw);
          });
          if (!matchTitle && !matchOps && !matchSeries && !matchCat && !matchMat && !matchNote && !matchImgTag) return false;
        }

        if (currentFilter.year !== 'ALL' && String(item.year) !== String(currentFilter.year)) return false;

        if (currentFilter.month !== 'ALL') {
          const itemDate = item.release_date || '';
          const monthStr = itemDate.length >= 7 ? itemDate.substring(5, 7) : '';
          if (monthStr !== currentFilter.month) return false;
        }

        if (currentFilter.series !== 'ALL' && (item.series || '').trim() !== currentFilter.series) return false;
        if (currentFilter.type !== 'ALL' && !(item.category || '').includes(currentFilter.type)) return false;

        return true;
      });

      filtered.sort((a, b) => {
        const ta = new Date(a.release_date || '2019-01-01').getTime();
        const tb = new Date(b.release_date || '2019-01-01').getTime();
        return currentFilter.sortBy === 'time-asc' ? ta - tb : tb - ta;
      });

      document.getElementById('match-count').innerText = filtered.length;
      const grid = document.getElementById('goods-grid');
      const empty = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "goods-card rounded-xl overflow-hidden flex flex-col justify-between Antigravity-pointer group";
        
        const { cover, matchedTag } = resolveSmartCover(item, currentFilter.keyword);
        card.onclick = () => openDetailModal(item, matchedTag);

        const ops = item.operators || [];
        const imgCount = (item.images && item.images.length > 1) ? item.images.length : 0;
        const isExpanded = !!expandedCardsMap[item.id];
        let opsHtml = '';

        if (ops.length > 0) {
          if (!isExpanded && ops.length > 2) {
            const displayedOps = ops.slice(0, 2);
            const remainCount = ops.length - 2;
            opsHtml = `
              <div class="flex items-center gap-1 mb-1.5 flex-wrap">
                ${displayedOps.map(op => `<button type="button" onclick="quickSearchOp(event, '${op}')" class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-zinc-800/80 text-zinc-300 hover:text-cyan-300 border border-zinc-700/40">#${op}</button>`).join('')}
                <button type="button" onclick="toggleOpsExpansion(event, '${item.id}')" title="点击展开全部干员" class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-cyan-950/60 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-900 transition-colors font-bold flex items-center gap-0.5">
                  +${remainCount}
                </button>
              </div>
            `;
          } else {
            opsHtml = `
              <div class="flex items-center gap-1 mb-1.5 flex-wrap">
                ${ops.map(op => `<button type="button" onclick="quickSearchOp(event, '${op}')" class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-zinc-800/80 text-zinc-300 hover:text-cyan-300 border border-zinc-700/40">#${op}</button>`).join('')}
                ${ops.length > 2 ? `
                  <button type="button" onclick="toggleOpsExpansion(event, '${item.id}')" title="点击收起干员" class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-zinc-800 text-zinc-400 hover:text-white border border-zinc-700 transition-colors">
                    收起
                  </button>
                ` : ''}
              </div>
            `;
          }
        }

        card.innerHTML = `
          <div>
            <div class="relative w-full aspect-square bg-[#090a0e] overflow-hidden flex items-center justify-center border-b border-zinc-800/60">
              <img src="${cover}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/400x400/18181b/22d3ee?text=图片载入中'">
              
              <div class="absolute top-1.5 left-1.5 flex gap-1">
                <span class="bg-cyan-500/90 backdrop-blur text-black font-bold text-[10px] px-1.5 py-0.2 rounded font-mono shadow">
                  ${item.category || '谷子'}
                </span>
                ${item.is_limited ? '<span class="bg-rose-600/90 backdrop-blur text-white font-mono text-[10px] px-1.5 py-0.2 rounded font-bold shadow">特典</span>' : ''}
                ${matchedTag ? `<span class="bg-black/85 backdrop-blur text-amber-300 border border-amber-500/40 font-mono text-[9px] px-1.5 py-0.2 rounded font-bold">已定位: ${matchedTag}</span>` : ''}
              </div>

              ${imgCount > 0 ? `
                <div class="absolute top-1.5 right-1.5 bg-black/80 backdrop-blur text-cyan-300 border border-cyan-500/40 font-mono text-[9px] px-1.5 py-0.5 rounded flex items-center gap-1 font-bold">
                  <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  <span>${imgCount}</span>
                </div>
              ` : ''}

              <span class="absolute bottom-1 right-1 bg-black/75 backdrop-blur text-zinc-400 font-mono text-[9px] px-1 py-0.2 rounded border border-zinc-800/80">
                ${item.release_date || ''}
              </span>
            </div>

            <div class="p-2.5 sm:p-3">
              ${opsHtml}
              <h3 class="text-xs sm:text-sm font-bold text-white group-hover:text-cyan-300 transition-colors leading-snug line-clamp-1" title="${item.title}">
                ${item.title}
              </h3>
              <p class="text-[11px] text-zinc-400 mt-0.5 line-clamp-1">
                ${item.series || '官方企划'}
              </p>
            </div>
          </div>

          <div class="px-2.5 py-2 sm:px-3 sm:py-2.5 bg-[#101117]/80 border-t border-zinc-800/80 flex justify-between items-center text-xs">
            <div class="flex items-baseline gap-1">
              <span class="text-zinc-500 text-[10px]">定价:</span>
              <span class="text-amber-400 font-bold text-xs sm:text-sm font-mono truncate max-w-[100px]">
                ${item.price.startsWith('¥') || !isNaN(item.price) ? (item.price.startsWith('¥') ? item.price : '¥' + item.price) : item.price}
              </span>
            </div>
            <div class="text-cyan-300/90 font-medium text-[10px] truncate max-w-[90px] text-right">
              ${item.obtain_type || '官方通贩'}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    // 🌟 打开详情大画廊弹窗
    function openDetailModal(item, targetTag) {
      let rawList = [];
      if (item.images && Array.isArray(item.images) && item.images.length > 0) {
        rawList = item.images;
      } else if (item.cover_url) {
        rawList = [item.cover_url];
      }

      currentModalImages = rawList.map(parseImageItem).filter(i => i.url && i.url.trim());

      if (currentModalImages.length === 0) {
        currentModalImages = [{ url: 'https://placehold.co/400x400/18181b/22d3ee?text=暂无图片', tag: '' }];
      }

      currentModalImgIndex = 0;
      if (targetTag) {
        const foundIdx = currentModalImages.findIndex(i => i.tag && i.tag.toLowerCase().includes(targetTag.toLowerCase()));
        if (foundIdx >= 0) currentModalImgIndex = foundIdx;
      }

      updateModalImgDisplay();

      document.getElementById('modal-title').innerText = item.title;
      document.getElementById('modal-series').innerText = `所属企划系列：${item.series || '官方企划'}`;
      document.getElementById('modal-date').innerText = item.release_date || '发售日待考';
      document.getElementById('modal-category').innerText = item.category || '谷子';
      document.getElementById('modal-price').innerText = item.price || '未标明';

      const ops = item.operators || [];
      const opsContainer = document.getElementById('modal-ops-box');
      if (ops.length > 0) {
        opsContainer.innerHTML = ops.map(op => `
          <button type="button" onclick="quickSearchOp(event, '${op}'); closeDetailModal();" class="px-2 py-0.5 bg-zinc-800 hover:bg-cyan-950 text-cyan-300 rounded font-mono text-[11px] border border-zinc-700/80 font-medium transition-colors" title="点击定位搜索该干员">
            #${op}
          </button>
        `).join('');
      } else {
        opsContainer.innerHTML = '<span class="text-zinc-500 font-sans">全员 / 无特定干员</span>';
      }

      document.getElementById('modal-spec').innerText = item.material || '官方未标明详细尺寸规格';
      document.getElementById('modal-channel').innerText = item.obtain_type || '朝陇山通贩';
      document.getElementById('modal-desc-box').innerText = item.note ? `考据笔记 / 历史背景：${item.note}` : '官方暂无特殊备注文案。';

      const limitedBadge = document.getElementById('modal-limited');
      if (item.is_limited) limitedBadge.classList.remove('hidden');
      else limitedBadge.classList.add('hidden');

      document.getElementById('detail-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    // 🌟 画廊大图与下方缩略图轨道同步更新
    function updateModalImgDisplay() {
      const mainImg = document.getElementById('modal-main-img');
      const pageBadge = document.getElementById('modal-page-badge');
      const tagBadge = document.getElementById('modal-tag-badge');
      const thumbRail = document.getElementById('modal-thumb-rail');
      const prevBtn = document.getElementById('modal-prev-btn');
      const nextBtn = document.getElementById('modal-next-btn');

      const cur = currentModalImages[currentModalImgIndex] || { url: '', tag: '' };
      mainImg.src = cur.url;
      pageBadge.innerText = `${currentModalImgIndex + 1} / ${currentModalImages.length}`;

      if (cur.tag) {
        tagBadge.classList.remove('hidden');
        tagBadge.innerText = cur.tag;
      } else {
        tagBadge.classList.add('hidden');
      }

      if (currentModalImages.length <= 1) {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        pageBadge.classList.add('hidden');
        thumbRail.classList.add('hidden');
        thumbRail.innerHTML = '';
      } else {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        pageBadge.classList.remove('hidden');
        thumbRail.classList.remove('hidden');
        
        // 🌟 缩略图大升级：图片尺寸适度加大，Tag 优雅展示在图片下方，清晰又舒展
        thumbRail.innerHTML = currentModalImages.map((item, i) => `
          <div onclick="switchModalImgIndex(${i})" class="flex flex-col items-center gap-1 shrink-0 Antigravity-pointer group">
            <div class="w-14 h-14 rounded-lg border ${i === currentModalImgIndex ? 'border-cyan-400 ring-2 ring-cyan-400/40' : 'border-zinc-700/60 opacity-60 hover:opacity-100'} overflow-hidden bg-black transition-all">
              <img src="${item.url}" class="w-full h-full object-cover">
            </div>
            ${item.tag ? `<span class="text-[10px] font-mono max-w-[56px] truncate text-center transition-colors ${i === currentModalImgIndex ? 'text-cyan-300 font-bold' : 'text-zinc-500 group-hover:text-zinc-300'}">${item.tag}</span>` : ''}
          </div>
        `).join('');
      }
    }

    function prevModalImg(e) {
      if (e) e.stopPropagation();
      if (currentModalImages.length <= 1) return;
      currentModalImgIndex = (currentModalImgIndex - 1 + currentModalImages.length) % currentModalImages.length;
      updateModalImgDisplay();
    }

    function nextModalImg(e) {
      if (e) e.stopPropagation();
      if (currentModalImages.length <= 1) return;
      currentModalImgIndex = (currentModalImgIndex + 1) % currentModalImages.length;
      updateModalImgDisplay();
    }

    window.switchModalImgIndex = function(index) {
      currentModalImgIndex = index;
      updateModalImgDisplay();
    };

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
