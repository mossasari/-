<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    /* 🌟 明亮舒适纸质大字风格 */
    body {
      background-color: #f3f4f6; /* 舒适浅灰底，彻底告别压抑黑 */
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pill-btn { white-space: nowrap; flex-shrink: 0; }

    /* 明亮图鉴卡片：纯白底板 + 悬浮柔和阴影 */
    .goods-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .goods-card:hover {
      transform: translateY(-3px);
      border-color: #0284c7;
      box-shadow: 0 12px 24px -8px rgba(2, 132, 199, 0.15);
    }

    /* 侧边栏按钮交互 */
    .sidebar-btn {
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
    }
    .sidebar-btn:hover {
      background-color: #f1f5f9;
      color: #0284c7;
      border-left-color: #38bdf8;
    }
    .sidebar-btn.active {
      background-color: #e0f2fe;
      color: #0369a1;
      border-left-color: #0284c7;
      font-weight: 700;
    }

    .fade-enter {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <script>
    const SUPABASE_URL = 'https://ybheoetxyihxiwtjtrql.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliaGVvZXR4eWloeGl3dGp0cnFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDk0OTcsImV4cCI6MjEwNzgyNTQ5N30.1W9VSg1KX8ucwBeeimCpCtsOjBzcVxxtTtroeEl1i50';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let ALL_GOODS = [];
    let currentFilter = {
      keyword: '',
      batch: 'ALL',       // 🌟 1. 上新档期筛选 (如: 朝陇山开市特惠, 恒远津梁)
      seriesLine: 'ALL',  // 🌟 2. 系列周边长线 (如: 通行认证, 人事部)
      year: 'ALL',        // 3. 年份
      category: 'ALL',    // 4. 品类形态
      sortBy: 'time-asc'
    };

    const expandedCardsMap = {};
    let currentModalImages = [];
    let currentModalImgIndex = 0;

    function parseImageItem(raw) {
      if (!raw) return { url: 'https://placehold.co/400x400/f3f4f6/9ca3af?text=暂无图片', tag: '' };
      if (typeof raw === 'string') {
        const trimmed = raw.trim();
        if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
          try {
            const parsed = JSON.parse(trimmed);
            return { url: parsed.url || '', tag: parsed.tag || '' };
          } catch(e){}
        }
        return { url: trimmed, tag: '' };
      }
      if (typeof raw === 'object') {
        return { url: raw.url || raw.cover_url || '', tag: raw.tag || '' };
      }
      return { url: String(raw), tag: '' };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      setupSearch();
      setupKeyboardNav();
      setupHistoryNav();
      await fetchAllGoods();
      renderSidebarBatches();
      renderSidebarYears();
      render();
    });

    async function fetchAllGoods() {
      try {
        const { data, error } = await supabaseClient
          .from('arknights_goods')
          .select('*')
          .order('release_date', { ascending: true });

        document.getElementById('loading-state').classList.add('hidden');
        if (error) throw error;
        ALL_GOODS = data || [];
        document.getElementById('total-count').innerText = ALL_GOODS.length;
        document.getElementById('badge-all-count').innerText = ALL_GOODS.length;

        // 计算系列周边数量
        const getLineCount = (kw) => ALL_GOODS.filter(i => (i.title || '').includes(kw) || (i.series || '').includes(kw)).length;
        document.getElementById('badge-txrz').innerText = getLineCount('通行认证');
        document.getElementById('badge-rsb').innerText = getLineCount('人事部');
        document.getElementById('badge-fssd').innerText = getLineCount('风尚速递');
        document.getElementById('badge-jshz').innerText = getLineCount('角色徽章');
        document.getElementById('badge-tzb').innerText = getLineCount('贴纸包');
        document.getElementById('badge-gyqz').innerText = getLineCount('干员棋子');

      } catch (err) {
        document.getElementById('loading-state').innerHTML = `<span class="text-rose-500 text-xs">加载失败: ${err.message}</span>`;
      }
    }

    // 🌟 1. 动态提炼渲染【上新档期】列表 (自动分析全部企划上新)
    function renderSidebarBatches() {
      const container = document.getElementById('sidebar-batches-list');
      const batchMap = {};

      ALL_GOODS.forEach(i => {
        const rawSeries = i.series || '常规通贩';
        // 拆分可能填写的多个复刻企划
        rawSeries.split(/[,，]/).forEach(s => {
          const name = s.trim();
          if (name) {
            if (!batchMap[name]) batchMap[name] = 0;
            batchMap[name]++;
          }
        });
      });

      const batchList = Object.keys(batchMap).sort((a,b) => batchMap[b] - batchMap[a]);
      container.innerHTML = batchList.map(name => `
        <button onclick="setBatchFilter('${name}')" class="sidebar-btn batch-btn w-full text-left px-3 py-1.5 rounded-lg flex justify-between items-center text-gray-700">
          <span class="truncate pr-1">${name}</span>
          <span class="text-[11px] text-gray-400 font-mono shrink-0">${batchMap[name]}</span>
        </button>
      `).join('');
    }

    // 🌟 2. 渲染年份芯片
    function renderSidebarYears() {
      const yearContainer = document.getElementById('sidebar-year-list');
      const dbYears = new Set(ALL_GOODS.map(i => String(i.year)).filter(y => y && y !== 'undefined' && y !== 'null'));
      ['2026', '2025', '2024', '2023', '2022', '2021', '2020', '2019', '2018', '2017'].forEach(y => dbYears.add(y));
      const sortedYears = Array.from(dbYears).sort((a, b) => b.localeCompare(a));

      yearContainer.innerHTML = sortedYears.map(y => `
        <button onclick="setYearFilter('${y}')" class="pill-btn year-pill px-2.5 py-1 rounded-md bg-gray-100 text-gray-700 border border-gray-200 text-xs font-mono">
          ${y}年
        </button>
      `).join('');
    }

    // 切换【上新档期】筛选
    window.setBatchFilter = function(batchName) {
      currentFilter.batch = batchName;
      currentFilter.seriesLine = 'ALL';
      currentFilter.year = 'ALL';

      clearAllSidebarActives();
      document.querySelectorAll('.batch-btn').forEach(btn => {
        if (btn.querySelector('span').innerText === batchName) btn.classList.add('active');
      });

      document.getElementById('current-filter-title').innerText = `上新档期 // ${batchName}`;
      render();
    };

    // 切换【系列周边】长线筛选
    window.setSeriesLineFilter = function(lineName) {
      currentFilter.seriesLine = lineName;
      currentFilter.batch = 'ALL';
      currentFilter.year = 'ALL';

      clearAllSidebarActives();
      document.querySelectorAll('.series-line-btn').forEach(btn => {
        if (btn.querySelector('span').innerText.includes(lineName)) btn.classList.add('active');
      });

      document.getElementById('current-filter-title').innerText = `系列周边 // ${lineName}系列`;
      render();
    };

    // 切换【发售年份】
    window.setYearFilter = function(y) {
      currentFilter.year = y;
      currentFilter.batch = 'ALL';
      currentFilter.seriesLine = 'ALL';

      clearAllSidebarActives();
      document.querySelectorAll('.year-pill').forEach(btn => {
        const active = btn.innerText.includes(y);
        btn.className = `pill-btn year-pill px-2.5 py-1 rounded-md text-xs font-mono transition-all ${
          active ? 'bg-sky-600 text-white font-bold' : 'bg-gray-100 text-gray-700 border border-gray-200'
        }`;
      });

      document.getElementById('current-filter-title').innerText = `${y} 年度在档周边`;
      render();
    };

    // 切换【制品品类】
    window.setCategoryFilter = function(cat) {
      currentFilter.category = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        const active = btn.innerText.includes(cat) || (cat === 'ALL' && btn.innerText === '全部');
        btn.className = `pill-btn cat-pill px-2.5 py-1 rounded-md text-xs transition-all ${
          active ? 'bg-sky-600 text-white font-bold' : 'bg-gray-100 text-gray-700 border border-gray-200'
        }`;
      });
      render();
    };

    function clearAllSidebarActives() {
      document.querySelectorAll('.sidebar-btn').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.year-pill').forEach(btn => {
        btn.className = 'pill-btn year-pill px-2.5 py-1 rounded-md bg-gray-100 text-gray-700 border border-gray-200 text-xs font-mono';
      });
    }

    window.resetAllFilters = function() {
      currentFilter = { keyword: '', batch: 'ALL', seriesLine: 'ALL', year: 'ALL', category: 'ALL', sortBy: 'time-asc' };
      clearAllSidebarActives();
      document.getElementById('filter-btn-all').classList.add('active');
      setCategoryFilter('ALL');
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search').classList.add('hidden');
      document.getElementById('current-filter-title').innerText = '全部在库周边';
      render();
    };

    function setupSearch() {
      const input = document.getElementById('search-input');
      const clear = document.getElementById('clear-search');
      input.addEventListener('input', (e) => {
        currentFilter.keyword = e.target.value.trim().toLowerCase();
        clear.classList.toggle('hidden', !currentFilter.keyword);
        render();
      });
      clear.addEventListener('click', () => {
        input.value = '';
        currentFilter.keyword = '';
        clear.classList.add('hidden');
        render();
      });
    }

    function setupKeyboardNav() {
      window.addEventListener('keydown', (e) => {
        const detailView = document.getElementById('detail-view');
        if (detailView.classList.contains('hidden')) return;

        if (e.key === 'ArrowLeft') prevModalImg();
        else if (e.key === 'ArrowRight') nextModalImg();
        else if (e.key === 'Escape') backToCatalog();
      });
    }

    function setupHistoryNav() {
      window.addEventListener('popstate', (e) => {
        if (!e.state || e.state.view !== 'detail') {
          showCatalogView();
        }
      });
    }

    window.toggleMobileSidebar = function() {
      const drawer = document.getElementById('sidebar-drawer');
      const backdrop = document.getElementById('sidebar-backdrop');
      drawer.classList.toggle('-translate-x-full');
      backdrop.classList.toggle('hidden');
    };

    function onSortChange(val) { currentFilter.sortBy = val; render(); }

    window.toggleOpsExpansion = function(e, itemId) {
      e.stopPropagation();
      expandedCardsMap[itemId] = !expandedCardsMap[itemId];
      render();
    };

    window.quickSearchOp = function(e, opName) {
      e.stopPropagation();
      document.getElementById('search-input').value = opName;
      currentFilter.keyword = opName.toLowerCase();
      document.getElementById('clear-search').classList.remove('hidden');
      if (document.getElementById('catalog-view').classList.contains('hidden')) {
        showCatalogView();
      }
      render();
    };

    function resolveSmartCover(item, keyword) {
      let candidateList = [];
      if (item.images && Array.isArray(item.images) && item.images.length > 0) {
        candidateList = item.images.map(parseImageItem);
      } else if (item.cover_url) {
        candidateList = [parseImageItem(item.cover_url)];
      }

      if (candidateList.length === 0) {
        return { cover: 'https://placehold.co/400x400/f3f4f6/9ca3af?text=暂无图片', matchedTag: '' };
      }

      const defaultCover = candidateList[0].url;
      if (!keyword) return { cover: defaultCover, matchedTag: '' };

      for (let img of candidateList) {
        if (img.tag) {
          const t = img.tag.toLowerCase();
          if (t.includes(keyword) || keyword.includes(t)) {
            return { cover: img.url, matchedTag: img.tag };
          }
        }
      }
      return { cover: defaultCover, matchedTag: '' };
    }

    function render() {
      let filtered = ALL_GOODS.filter(item => {
        // 1. 关键字搜索
        if (currentFilter.keyword) {
          const kw = currentFilter.keyword;
          const matchTitle = (item.title || '').toLowerCase().includes(kw);
          const matchOps = (item.operators || []).some(op => String(op).toLowerCase().includes(kw));
          const matchSeries = (item.series || '').toLowerCase().includes(kw);
          const matchCat = (item.category || '').toLowerCase().includes(kw);
          const matchMat = (item.material || '').toLowerCase().includes(kw);
          const matchNote = (item.note || '').toLowerCase().includes(kw);
          const matchImgTag = (item.images || []).some(img => {
            const parsed = parseImageItem(img);
            return parsed.tag && parsed.tag.toLowerCase().includes(kw);
          });
          const matchRp = (item.reprint_history || []).some(rp => (rp.series || '').toLowerCase().includes(kw));
          if (!matchTitle && !matchOps && !matchSeries && !matchCat && !matchMat && !matchNote && !matchImgTag && !matchRp) return false;
        }

        // 🌟 2. 按【上新档期】过滤 (精确对准首发和复刻企划)
        if (currentFilter.batch !== 'ALL') {
          const b = currentFilter.batch;
          const inSeries = (item.series || '').includes(b);
          const inRp = (item.reprint_history || []).some(rp => (rp.series || '').includes(b));
          if (!inSeries && !inRp) return false;
        }

        // 🌟 3. 按【系列周边】长线过滤 (通行证/人事部/徽章等)
        if (currentFilter.seriesLine !== 'ALL') {
          const sl = currentFilter.seriesLine;
          const inTitle = (item.title || '').includes(sl);
          const inSeries = (item.series || '').includes(sl);
          if (!inTitle && !inSeries) return false;
        }

        // 4. 按【发售年份】过滤
        if (currentFilter.year !== 'ALL' && String(item.year) !== String(currentFilter.year)) return false;

        // 5. 按【制品品类】过滤
        if (currentFilter.category !== 'ALL' && !(item.category || '').includes(currentFilter.category)) return false;

        return true;
      });

      filtered.sort((a, b) => {
        const ta = new Date(a.release_date || '2019-01-01').getTime();
        const tb = new Date(b.release_date || '2019-01-01').getTime();
        return currentFilter.sortBy === 'time-asc' ? ta - tb : tb - ta;
      });

      document.getElementById('match-count').innerText = filtered.length;
      const grid = document.getElementById('goods-grid');
      const empty = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "goods-card rounded-2xl overflow-hidden flex flex-col justify-between Antigravity-pointer group";
        
        const { cover, matchedTag } = resolveSmartCover(item, currentFilter.keyword);
        card.onclick = () => openItemDetail(item, matchedTag);

        const ops = item.operators || [];
        const imgCount = (item.images && item.images.length > 1) ? item.images.length : 0;
        const rpCount = (item.reprint_history && Array.isArray(item.reprint_history)) ? item.reprint_history.length : 0;
        const isExpanded = !!expandedCardsMap[item.id];
        let opsHtml = '';

        if (ops.length > 0) {
          if (!isExpanded && ops.length > 2) {
            const displayedOps = ops.slice(0, 2);
            const remainCount = ops.length - 2;
            opsHtml = `
              <div class="flex items-center gap-1.5 mb-2 flex-wrap">
                ${displayedOps.map(op => `<button type="button" onclick="quickSearchOp(event, '${op}')" class="text-xs px-2 py-0.5 rounded-md bg-gray-100 hover:bg-sky-50 text-gray-700 hover:text-sky-700 border border-gray-200">#${op}</button>`).join('')}
                <button type="button" onclick="toggleOpsExpansion(event, '${item.id}')" title="点击展开全部干员" class="text-xs px-1.5 py-0.5 rounded-md bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100 font-bold">
                  +${remainCount}
                </button>
              </div>
            `;
          } else {
            opsHtml = `
              <div class="flex items-center gap-1.5 mb-2 flex-wrap">
                ${ops.map(op => `<button type="button" onclick="quickSearchOp(event, '${op}')" class="text-xs px-2 py-0.5 rounded-md bg-gray-100 hover:bg-sky-50 text-gray-700 hover:text-sky-700 border border-gray-200">#${op}</button>`).join('')}
                ${ops.length > 2 ? `
                  <button type="button" onclick="toggleOpsExpansion(event, '${item.id}')" title="点击收起干员" class="text-xs px-1.5 py-0.5 rounded-md bg-gray-100 text-gray-500 hover:text-gray-900 border border-gray-200">
                    收起
                  </button>
                ` : ''}
              </div>
            `;
          }
        }

        card.innerHTML = `
          <div>
            <!-- 封面图 -->
            <div class="relative w-full aspect-square bg-gray-100 overflow-hidden flex items-center justify-center border-b border-gray-100">
              <img src="${cover}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/400x400/f3f4f6/9ca3af?text=载入中'">
              
              <div class="absolute top-2 left-2 flex gap-1.5">
                <span class="bg-sky-600 text-white font-bold text-[11px] px-2 py-0.5 rounded-md shadow-xs">
                  ${item.category || '谷子'}
                </span>
                ${item.is_limited ? '<span class="bg-rose-500 text-white font-mono text-[11px] px-2 py-0.5 rounded-md font-bold shadow-xs">特典</span>' : ''}
                ${rpCount > 0 ? `<span class="bg-amber-500 text-white font-mono text-[11px] px-2 py-0.5 rounded-md font-bold shadow-xs">再版×${rpCount}</span>` : ''}
                ${matchedTag ? `<span class="bg-white/95 text-amber-600 border border-amber-300 font-bold text-[11px] px-2 py-0.5 rounded-md shadow-xs">已定位: ${matchedTag}</span>` : ''}
              </div>

              ${imgCount > 0 ? `
                <div class="absolute top-2 right-2 bg-black/60 backdrop-blur text-white font-mono text-xs px-2 py-0.5 rounded-md flex items-center gap-1 font-bold">
                  <i data-lucide="image" class="w-3 h-3"></i>
                  <span>${imgCount}</span>
                </div>
              ` : ''}

              <span class="absolute bottom-2 right-2 bg-white/90 backdrop-blur text-gray-700 font-mono text-[11px] px-2 py-0.5 rounded-md border border-gray-200 shadow-2xs">
                ${item.release_date || ''}
              </span>
            </div>

            <!-- 卡片信息主体 (大字加粗，清晰舒服) -->
            <div class="p-3.5 sm:p-4">
              ${opsHtml}
              <h3 class="text-sm sm:text-base font-bold text-gray-900 group-hover:text-sky-600 transition-colors leading-snug line-clamp-2" title="${item.title}">
                ${item.title}
              </h3>
              <p class="text-xs text-gray-500 mt-1 line-clamp-1">
                ${item.series || '官方企划'}
              </p>
            </div>
          </div>

          <!-- 价格与途径底栏 -->
          <div class="px-3.5 py-3 sm:px-4 sm:py-3.5 bg-gray-50/70 border-t border-gray-100 flex justify-between items-center text-xs">
            <div class="flex items-baseline gap-1">
              <span class="text-gray-400 text-xs">定价:</span>
              <span class="text-amber-600 font-bold text-sm sm:text-base font-mono truncate max-w-[110px]">
                ${item.price.startsWith('¥') || !isNaN(item.price) ? (item.price.startsWith('¥') ? item.price : '¥' + item.price) : item.price}
              </span>
            </div>
            <div class="text-sky-700 font-medium text-xs truncate max-w-[110px] text-right">
              ${item.obtain_type || '线上购入'}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    // 展厅推进
    function openItemDetail(item, targetTag) {
      history.pushState({ view: 'detail', id: item.id }, '', `#item-${item.id}`);

      let rawList = [];
      if (item.images && Array.isArray(item.images) && item.images.length > 0) {
        rawList = item.images;
      } else if (item.cover_url) {
        rawList = [item.cover_url];
      }

      currentModalImages = rawList.map(parseImageItem).filter(i => i.url && i.url.trim());
      if (currentModalImages.length === 0) {
        currentModalImages = [{ url: 'https://placehold.co/400x400/f3f4f6/9ca3af?text=暂无图片', tag: '' }];
      }

      currentModalImgIndex = 0;
      if (targetTag) {
        const foundIdx = currentModalImages.findIndex(i => i.tag && i.tag.toLowerCase().includes(targetTag.toLowerCase()));
        if (foundIdx >= 0) currentModalImgIndex = foundIdx;
      }

      updateDetailImgDisplay();

      // 文本填充
      document.getElementById('view-b-title').innerText = item.title;
      document.getElementById('view-b-series').innerText = `首发企划档期：${item.series || '官方企划'}`;
      document.getElementById('view-b-date').innerText = item.release_date || '发售日待考';
      document.getElementById('view-b-category').innerText = item.category || '谷子';
      document.getElementById('view-b-price').innerText = item.price || '未标明';

      const ops = item.operators || [];
      const opsContainer = document.getElementById('view-b-ops-box');
      if (ops.length > 0) {
        opsContainer.innerHTML = ops.map(op => `
          <button type="button" onclick="quickSearchOp(event, '${op}')" class="px-2.5 py-1 bg-gray-100 hover:bg-sky-50 text-gray-800 hover:text-sky-700 rounded-lg text-xs border border-gray-200 font-medium transition-colors" title="点击筛选该干员全库">
            #${op}
          </button>
        `).join('');
      } else {
        opsContainer.innerHTML = '<span class="text-gray-400">全员 / 无特定干员</span>';
      }

      document.getElementById('view-b-spec').innerText = item.material || '官方未标明详细尺寸规格';
      document.getElementById('view-b-channel').innerText = item.obtain_type || '线上购入';
      document.getElementById('view-b-desc-box').innerText = item.note ? item.note : '官方暂无特殊历史考据备注文案。';

      const limitedBadge = document.getElementById('view-b-limited');
      if (item.is_limited) limitedBadge.classList.remove('hidden');
      else limitedBadge.classList.add('hidden');

      // 渲染复刻履历
      const rpSection = document.getElementById('view-b-reprint-section');
      const rpTimeline = document.getElementById('view-b-reprint-timeline');
      const rpBadge = document.getElementById('view-b-reprint-badge');
      const reprintList = (item.reprint_history && Array.isArray(item.reprint_history)) ? item.reprint_history : [];

      if (reprintList.length > 0) {
        rpSection.classList.remove('hidden');
        rpBadge.innerText = `共 ${reprintList.length} 次再版记录`;

        rpTimeline.innerHTML = reprintList.map(rp => `
          <div class="p-3 bg-white rounded-xl border border-amber-200/80 flex flex-col gap-1 shadow-2xs">
            <div class="flex items-center justify-between">
              <span class="text-amber-800 font-bold text-xs">${rp.tag || '复刻再版'}</span>
              <span class="text-gray-400 text-xs font-mono">${rp.date || ''}</span>
            </div>
            <div class="text-gray-900 font-bold text-xs">${rp.series || '官方复刻企划'}</div>
            <div class="flex justify-between items-center text-xs text-gray-500 pt-1.5 border-t border-gray-100">
              <span>定价: <strong class="text-amber-600 font-mono font-bold">${rp.price || '原价'}</strong></span>
              <span>渠道: <strong class="text-sky-700">${rp.channel || '线上通贩'}</strong></span>
            </div>
          </div>
        `).join('');
      } else {
        rpSection.classList.add('hidden');
        rpTimeline.innerHTML = '';
      }

      document.getElementById('catalog-view').classList.add('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'instant' });
      lucide.createIcons();
    }

    function backToCatalog() {
      history.pushState(null, '', window.location.pathname);
      showCatalogView();
    }

    function showCatalogView() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('catalog-view').classList.remove('hidden');
    }

    function updateDetailImgDisplay() {
      const mainImg = document.getElementById('view-b-main-img');
      const pageBadge = document.getElementById('view-b-page-badge');
      const tagBadge = document.getElementById('view-b-tag-badge');
      const thumbRail = document.getElementById('view-b-thumb-rail');
      const prevBtn = document.getElementById('view-b-prev-btn');
      const nextBtn = document.getElementById('view-b-next-btn');

      const cur = currentModalImages[currentModalImgIndex] || { url: '', tag: '' };
      mainImg.src = cur.url;
      pageBadge.innerText = `${currentModalImgIndex + 1} / ${currentModalImages.length}`;

      if (cur.tag) {
        tagBadge.classList.remove('hidden');
        tagBadge.innerText = cur.tag;
      } else {
        tagBadge.classList.add('hidden');
      }

      if (currentModalImages.length <= 1) {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        pageBadge.classList.add('hidden');
        thumbRail.classList.add('hidden');
        thumbRail.innerHTML = '';
      } else {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        pageBadge.classList.remove('hidden');
        thumbRail.classList.remove('hidden');
        
        thumbRail.innerHTML = currentModalImages.map((item, i) => `
          <div onclick="switchModalImgIndex(${i})" class="flex flex-col items-center gap-1.5 shrink-0 Antigravity-pointer group">
            <div class="w-16 h-16 rounded-xl border ${i === currentModalImgIndex ? 'border-sky-600 ring-2 ring-sky-200' : 'border-gray-200 opacity-60 hover:opacity-100'} overflow-hidden bg-gray-50 transition-all shadow-xs">
              <img src="${item.url}" class="w-full h-full object-cover">
            </div>
            ${item.tag ? `<span class="text-xs font-mono max-w-[64px] truncate text-center transition-colors ${i === currentModalImgIndex ? 'text-sky-700 font-bold' : 'text-gray-400 group-hover:text-gray-700'}">${item.tag}</span>` : ''}
          </div>
        `).join('');
      }
    }

    function prevModalImg(e) {
      if (e) e.stopPropagation();
      if (currentModalImages.length <= 1) return;
      currentModalImgIndex = (currentModalImgIndex - 1 + currentModalImages.length) % currentModalImages.length;
      updateDetailImgDisplay();
    }

    function nextModalImg(e) {
      if (e) e.stopPropagation();
      if (currentModalImages.length <= 1) return;
      currentModalImgIndex = (currentModalImgIndex + 1) % currentModalImages.length;
      updateDetailImgDisplay();
    }

    window.switchModalImgIndex = function(index) {
      currentModalImgIndex = index;
      updateDetailImgDisplay();
    };
  </script>
</body>
</html>
