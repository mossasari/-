<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>朝陇山谷子图鉴档案库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0b0c0e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .pill-btn {
      white-space: nowrap;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-black">

  <!-- 1. 吸顶区：Logo + 超醒目搜索框 -->
  <header class="sticky top-0 z-40 bg-[#111216]/95 backdrop-blur-md border-b border-zinc-800/80 px-3 py-2.5 sm:px-6 sm:py-3.5">
    <div class="max-w-7xl mx-auto flex flex-col gap-2.5">
      
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 sm:w-8 sm:h-8 bg-cyan-400 text-black font-black flex items-center justify-center rounded text-sm sm:text-base tracking-tighter">
            CLS
          </div>
          <div>
            <h1 class="text-sm sm:text-base font-bold tracking-wide text-white flex items-center gap-1.5">
              朝陇山谷子图鉴
              <span class="text-[9px] bg-zinc-800 text-cyan-400 border border-zinc-700 px-1 py-0.2 rounded font-mono">2017-NOW</span>
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a href="admin.html" class="text-xs bg-cyan-400/10 hover:bg-cyan-400/20 text-cyan-300 border border-cyan-500/30 px-2.5 py-1 rounded flex items-center gap-1 transition-colors font-medium">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>录入谷子</span>
          </a>
          <div class="text-[11px] font-mono text-zinc-400 hidden sm:block">
            收录: <span id="total-count" class="text-cyan-400 font-bold">0</span> 件
          </div>
        </div>
      </div>

      <!-- 搜索框 -->
      <div class="relative w-full">
        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-cyan-400 w-4 h-4 pointer-events-none"></i>
        <input 
          id="search-input"
          type="search"
          enterkeyhint="search"
          placeholder="搜索干员代号/周边名称/特典/价格/材质..."
          class="w-full bg-[#181920] text-gray-100 placeholder-zinc-500 pl-10 pr-9 py-2.5 rounded-lg border border-zinc-700 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 text-xs sm:text-sm shadow-inner"
        />
        <button id="clear-search" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 p-1 hover:text-white">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- 移动端横滑筛选行 -->
      <div class="flex flex-col gap-2 pt-1 md:hidden">
        <!-- 年份横滑（2017起） -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs font-mono">
          <span class="text-zinc-500 text-[10px] shrink-0 mr-1">年份:</span>
          <div id="m-year-list" class="flex gap-1.5">
            <button data-year="ALL" class="pill-btn year-pill active px-2.5 py-1 rounded bg-cyan-400 text-black font-bold text-xs">全部</button>
            <button data-year="2017" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2017</button>
            <button data-year="2018" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2018</button>
            <button data-year="2019" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2019</button>
            <button data-year="2020" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2020</button>
            <button data-year="2021" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2021</button>
            <button data-year="2022" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2022</button>
            <button data-year="2023" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2023</button>
            <button data-year="2024" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2024</button>
            <button data-year="2025" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2025</button>
            <button data-year="2026" class="pill-btn year-pill px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs border border-zinc-700">2026</button>
          </div>
        </div>

        <!-- 分类横滑 -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
          <span class="text-zinc-500 text-[10px] shrink-0 mr-1">分类:</span>
          <div id="m-type-list" class="flex gap-1.5">
            <button data-type="ALL" class="pill-btn type-pill active px-2.5 py-1 rounded-full bg-white text-black font-semibold text-xs">全部</button>
            <button data-type="徽章/贴纸" class="pill-btn type-pill px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300 text-xs">徽章/贴纸</button>
            <button data-type="手办/摆件" class="pill-btn type-pill px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300 text-xs">手办/摆件</button>
            <button data-type="立牌" class="pill-btn type-pill px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300 text-xs">亚克力立牌</button>
            <button data-type="毛绒" class="pill-btn type-pill px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300 text-xs">毛绒玩偶</button>
            <button data-type="特典" class="pill-btn type-pill px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300 text-xs">特典物料</button>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- 2. 主页面容器 -->
  <div class="flex-1 max-w-7xl w-full mx-auto flex px-3 sm:px-6 py-4 gap-6">

    <!-- PC 端左侧时间栏 -->
    <aside class="hidden md:flex w-52 shrink-0 flex-col gap-4">
      <div class="bg-[#14151a] border border-zinc-800 rounded-lg p-3.5 sticky top-28">
        <div class="flex items-center justify-between pb-2.5 border-b border-zinc-800 mb-2.5">
          <span class="text-xs font-bold text-zinc-300 uppercase tracking-wider flex items-center gap-1.5 font-mono">
            <i data-lucide="clock" class="w-3.5 h-3.5 text-cyan-400"></i> 发售年份
          </span>
          <button id="pc-reset-year" class="text-[11px] text-zinc-500 hover:text-cyan-400">重置</button>
        </div>

        <div id="pc-year-filters" class="flex flex-col gap-1 font-mono text-xs max-h-[65vh] overflow-y-auto pr-1">
          <button data-year="ALL" class="pc-year-btn active text-left px-2.5 py-1.5 rounded bg-cyan-400/10 text-cyan-300 font-bold border border-cyan-500/20">全部年份</button>
          <button data-year="2026" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800">2026 年</button>
          <button data-year="2025" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800">2025 年</button>
          <button data-year="2024" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800">2024 年</button>
          <button data-year="2023" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800">2023 年</button>
          <button data-year="2022" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800">2022 年</button>
          <button data-year="2021" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800">2021 年</button>
          <button data-year="2020" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800">2020 年</button>
          <button data-year="2019" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800 flex justify-between items-center">
            <span>2019 年 (开市)</span>
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
          </button>
          <button data-year="2018" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800">2018 年</button>
          <button data-year="2017" class="pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800 flex justify-between items-center">
            <span>2017 年 (创设)</span>
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 右侧卡片瀑布流 -->
    <main class="flex-1 flex flex-col gap-3 min-w-0">

      <!-- PC 端制品分类 -->
      <div class="hidden md:flex flex-col gap-2.5 bg-[#14151a] border border-zinc-800 rounded-lg p-3.5 text-xs">
        <div class="flex items-center gap-2">
          <span class="text-zinc-500 shrink-0">制品分类:</span>
          <div id="pc-type-filters" class="flex flex-wrap gap-1.5">
            <button data-type="ALL" class="pc-type-btn active px-2.5 py-1 rounded bg-white text-black font-semibold">全部</button>
            <button data-type="徽章/贴纸" class="pc-type-btn px-2.5 py-1 rounded bg-zinc-800 text-zinc-400 hover:text-white">徽章/贴纸</button>
            <button data-type="手办/摆件" class="pc-type-btn px-2.5 py-1 rounded bg-zinc-800 text-zinc-400 hover:text-white">手办/摆件</button>
            <button data-type="挂件" class="pc-type-btn px-2.5 py-1 rounded bg-zinc-800 text-zinc-400 hover:text-white">挂件</button>
            <button data-type="立牌" class="pc-type-btn px-2.5 py-1 rounded bg-zinc-800 text-zinc-400 hover:text-white">亚克力立牌</button>
            <button data-type="毛绒" class="pc-type-btn px-2.5 py-1 rounded bg-zinc-800 text-zinc-400 hover:text-white">毛绒玩偶</button>
            <button data-type="特典" class="pc-type-btn px-2.5 py-1 rounded bg-zinc-800 text-zinc-400 hover:text-white">开市/满赠特典</button>
          </div>
        </div>
      </div>

      <!-- 计数与排序 -->
      <div class="flex items-center justify-between text-[11px] text-zinc-400 px-0.5">
        <div>筛选结果：<span id="match-count" class="text-white font-mono font-bold">0</span> 件</div>
        <div class="flex items-center gap-1.5">
          <span>排序:</span>
          <select id="sort-select" class="bg-[#181920] text-zinc-300 border border-zinc-800 rounded px-1.5 py-0.5 text-[11px] focus:outline-none focus:border-cyan-400">
            <option value="time-asc" selected>从古至今 (2017起)</option>
            <option value="time-desc">最新在前</option>
          </select>
        </div>
      </div>

      <!-- 谷子卡片网格 (移动端双列，PC端四列) -->
      <div id="goods-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-4"></div>

      <!-- 加载提示 -->
      <div id="loading-state" class="py-20 text-center text-zinc-500 flex flex-col items-center justify-center gap-2">
        <i data-lucide="loader-2" class="w-6 h-6 text-cyan-400 animate-spin"></i>
        <span class="text-xs font-mono">从 Supabase 加载图鉴数据...</span>
      </div>

      <!-- 空结果提示 -->
      <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center text-zinc-500">
        <i data-lucide="package-search" class="w-10 h-10 stroke-[1.5] mb-2 text-zinc-600"></i>
        <p class="text-xs">未找到符合条件的谷子记录</p>
      </div>

    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://ybheoetxyihxiwtjtrql.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliaGVvZXR4eWloeGl3dGp0cnFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDk0OTcsImV4cCI6MjEwNzgyNTQ5N30.1W9VSg1KX8ucwBeeimCpCtsOjBzcVxxtTtroeEl1i50';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let GOODS_DATA = [];
    let currentFilter = { keyword: '', year: 'ALL', type: 'ALL', sortBy: 'time-asc' };

    const goodsGrid = document.getElementById('goods-grid');
    const loadingState = document.getElementById('loading-state');
    const emptyState = document.getElementById('empty-state');
    const searchInput = document.getElementById('search-input');
    const clearSearch = document.getElementById('clear-search');
    const matchCount = document.getElementById('match-count');
    const totalCount = document.getElementById('total-count');
    const sortSelect = document.getElementById('sort-select');

    async function loadDataFromSupabase() {
      try {
        const { data, error } = await supabaseClient
          .from('arknights_goods')
          .select('*')
          .order('release_date', { ascending: true });

        loadingState.classList.add('hidden');

        if (error) throw error;
        GOODS_DATA = data || [];
        totalCount.textContent = GOODS_DATA.length;
        render();
      } catch (err) {
        loadingState.innerHTML = `<span class="text-rose-400 text-xs">加载数据失败: ${err.message}</span>`;
      }
    }

    function setupEvents() {
      searchInput.addEventListener('input', (e) => {
        currentFilter.keyword = e.target.value.trim().toLowerCase();
        clearSearch.classList.toggle('hidden', !currentFilter.keyword);
        render();
      });

      clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        currentFilter.keyword = '';
        clearSearch.classList.add('hidden');
        render();
      });

      document.querySelectorAll('.year-pill, .pc-year-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter.year = btn.dataset.year;
          syncYearUI(currentFilter.year);
          render();
        });
      });

      document.getElementById('pc-reset-year').addEventListener('click', () => {
        currentFilter.year = 'ALL';
        syncYearUI('ALL');
        render();
      });

      document.querySelectorAll('.type-pill, .pc-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter.type = btn.dataset.type;
          syncTypeUI(currentFilter.type);
          render();
        });
      });

      sortSelect.addEventListener('change', (e) => {
        currentFilter.sortBy = e.target.value;
        render();
      });
    }

    function syncYearUI(year) {
      document.querySelectorAll('.year-pill').forEach(b => {
        const active = b.dataset.year === year;
        b.className = `pill-btn year-pill px-2.5 py-1 rounded text-xs transition-all ${
          active ? 'bg-cyan-400 text-black font-bold' : 'bg-zinc-800 text-zinc-300 border border-zinc-700'
        }`;
      });
      document.querySelectorAll('.pc-year-btn').forEach(b => {
        const active = b.dataset.year === year;
        b.className = active 
          ? 'pc-year-btn text-left px-2.5 py-1.5 rounded bg-cyan-400/10 text-cyan-300 font-bold border border-cyan-500/20'
          : 'pc-year-btn text-left px-2.5 py-1.5 rounded text-zinc-400 hover:bg-zinc-800';
      });
    }

    function syncTypeUI(type) {
      document.querySelectorAll('.type-pill, .pc-type-btn').forEach(b => {
        const active = b.dataset.type === type;
        if (b.classList.contains('type-pill')) {
          b.className = `pill-btn type-pill px-2.5 py-1 rounded-full text-xs font-semibold ${
            active ? 'bg-white text-black' : 'bg-zinc-800 text-zinc-300'
          }`;
        } else {
          b.className = `pc-type-btn px-2.5 py-1 rounded ${
            active ? 'bg-white text-black font-semibold' : 'bg-zinc-800 text-zinc-400 hover:text-white'
          }`;
        }
      });
    }

    function render() {
      let filtered = GOODS_DATA.filter(item => {
        if (currentFilter.keyword) {
          const kw = currentFilter.keyword;
          const matchTitle = (item.title || '').toLowerCase().includes(kw);
          const matchOp = (item.operators || []).some(op => op.toLowerCase().includes(kw));
          const matchSeries = (item.series || '').toLowerCase().includes(kw);
          const matchCat = (item.category || '').toLowerCase().includes(kw);
          const matchPrice = (item.price || '').toLowerCase().includes(kw);
          const matchMat = (item.material || '').toLowerCase().includes(kw);
          if (!matchTitle && !matchOp && !matchSeries && !matchCat && !matchPrice && !matchMat) return false;
        }
        if (currentFilter.year !== 'ALL' && String(item.year) !== String(currentFilter.year)) return false;
        if (currentFilter.type !== 'ALL' && !(item.category || '').includes(currentFilter.type)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        const ta = new Date(a.release_date).getTime();
        const tb = new Date(b.release_date).getTime();
        return currentFilter.sortBy === 'time-asc' ? ta - tb : tb - ta;
      });

      matchCount.textContent = filtered.length;
      goodsGrid.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-[#14151a] rounded-lg border border-zinc-800/90 overflow-hidden flex flex-col justify-between hover:border-cyan-400/40 transition-all";
        
        const ops = item.operators || [];
        const cover = item.cover_url || 'https://placehold.co/400x400/18181b/22d3ee?text=暂无图片';

        card.innerHTML = `
          <div>
            <!-- 封面图 -->
            <div class="relative w-full aspect-square bg-[#0b0c0e] overflow-hidden flex items-center justify-center">
              <img src="${cover}" alt="${item.title}" class="w-full h-full object-cover">
              ${item.is_limited ? '<span class="absolute top-1.5 left-1.5 bg-rose-600 text-white font-mono text-[9px] px-1 py-0.2 rounded font-bold">限定特典</span>' : ''}
              <span class="absolute bottom-1 right-1 bg-black/70 text-zinc-300 font-mono text-[9px] px-1 py-0.2 rounded">
                ${item.release_date || ''}
              </span>
            </div>

            <!-- 标题与干员分类 -->
            <div class="p-2 sm:p-3">
              <div class="flex items-center gap-1 mb-1 flex-wrap">
                <span class="text-[9px] font-mono px-1 py-0.2 rounded bg-zinc-800 text-cyan-400 border border-zinc-700">${item.category || '谷子'}</span>
                ${ops.map(op => `<span class="text-[9px] font-mono px-1 py-0.2 rounded bg-zinc-800 text-zinc-300">#${op}</span>`).join('')}
              </div>
              <h3 class="text-xs sm:text-sm font-bold text-zinc-100 line-clamp-1" title="${item.title}">${item.title}</h3>
              <p class="text-[10px] sm:text-xs text-zinc-400 line-clamp-1 mt-0.5">${item.series || '官方企划'}</p>
            </div>
          </div>

          <!-- 价格与途径双行展示 -->
          <div class="px-2 pb-2 sm:px-3 sm:pb-3 pt-1 border-t border-zinc-800/80 text-[10px] font-mono space-y-0.5">
            <div class="flex justify-between items-center">
              <span class="text-zinc-500">价格:</span>
              <span class="text-amber-400 font-bold truncate max-w-[110px]">${item.price || '非卖品/未标明'}</span>
            </div>
            <div class="flex justify-between items-center text-zinc-400">
              <span class="text-zinc-500">途径:</span>
              <span class="text-cyan-300/90 truncate max-w-[110px]">${item.obtain_type || '官方通贩'}</span>
            </div>
          </div>
        `;
        goodsGrid.appendChild(card);
      });

      lucide.createIcons();
    }

    setupEvents();
    loadDataFromSupabase();
  </script>
</body>
</html>
